[project]
name = "llm-research"
version = "0.1.0"
description = "Reproducible Qwen3-0.6B LoRA research on WSL2"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "accelerate>=1.0,<2",
  "datasets>=3,<5",
  "huggingface-hub>=0.35,<1",
  "peft>=0.15,<1",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "tensorboard>=2.18,<3",
  "torch==2.9.0",
  "transformers>=4.51,<5",
  "trl>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
qlora = ["bitsandbytes>=0.45,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_research"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
